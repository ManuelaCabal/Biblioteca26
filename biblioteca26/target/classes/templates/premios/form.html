<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Formulario Premio</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<h2>Formulario Premio</h2>
<a th:href="@{/premios}">Volver</a>
<form th:action="@{/premios/guardar}" th:object="${item}" method="post">
    <input type="hidden" th:field="*{id}">
    <div><label>Nombre</label><input type="text" th:field="*{nomPremio}"></div>
    <div>
        <label>Pais</label>
        <select name="pais.id" required>
            <option value="">--Selecciona--</option>
            <option th:each="pais : ${paises}" th:value="${pais.id}" th:text="${pais.nomPais}"
                    th:selected="${item.pais != null and item.pais.id == pais.id}"></option>
        </select>
    </div>
    <div><label>Tipo</label><input type="text" th:field="*{tipo}"></div>
    <div><label>Logotipo</label><input type="text" th:field="*{logotipo}"></div>
    <button type="submit">Guardar</button>
</form>
</body>
</html>
