<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Series</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<h2>Series</h2>
<a th:href="@{/}">Inicio</a> | <a th:href="@{/series/nuevo}">Nuevo</a>
<table border="1">
    <tr><th>ID</th><th>Denominacion</th><th>Acciones</th></tr>
    <tr th:each="item : ${items}">
        <td th:text="${item.id}"></td>
        <td th:text="${item.denominacion}"></td>
        <td>
            <a th:href="@{/series/ver/{id}(id=${item.id})}">Ver</a>
            <a th:href="@{/series/editar/{id}(id=${item.id})}">Editar</a>
            <a th:href="@{/series/eliminar/{id}(id=${item.id})}">Eliminar</a>
        </td>
    </tr>
</table>
</body>
</html>
