<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Formulario Autor Libro</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<h2>Formulario Autor Libro</h2>
<a th:href="@{/autor-libros}">Volver</a>
<form th:action="@{/autor-libros/guardar}" th:object="${item}" method="post">
    <input type="hidden" th:field="*{id}">
    <div>
        <label>Autor</label>
        <select name="autor.id" required>
            <option value="">--Selecciona--</option>
            <option th:each="autor : ${autores}" th:value="${autor.id}" th:text="${autor.nomAutor}"
                    th:selected="${item.autor != null and item.autor.id == autor.id}"></option>
        </select>
    </div>
    <div>
        <label>Libro</label>
        <select name="libro.id" required>
            <option value="">--Selecciona--</option>
            <option th:each="libro : ${libros}" th:value="${libro.id}" th:text="${libro.nomLibro}"
                    th:selected="${item.libro != null and item.libro.id == libro.id}"></option>
        </select>
    </div>
    <button type="submit">Guardar</button>
</form>
</body>
</html>
