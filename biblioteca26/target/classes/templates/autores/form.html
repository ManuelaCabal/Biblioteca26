<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Autor</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<h2>Formulario Autor</h2>
<a th:href="@{/autores}">Volver</a>
<form th:action="@{/autores/guardar}" th:object="${item}" method="post" class="autor-form">
    <input type="hidden" th:field="*{id}">

    <div class="autor-form-grid">
        <div class="autor-field">
            <label>Nombre</label>
            <input type="text" th:field="*{nomAutor}">
        </div>
        <div class="autor-field">
            <label>Apellido 1</label>
            <input type="text" th:field="*{apellido1}">
        </div>
        <div class="autor-field">
            <label>Apellido 2</label>
            <input type="text" th:field="*{apellido2}">
        </div>
        <div class="autor-field">
            <label>Fecha Nac</label>
            <input type="date" th:field="*{fNac}">
        </div>
        <div class="autor-field">
            <label>Fecha Def</label>
            <input type="date" th:field="*{fDef}">
        </div>
        <div class="autor-field">
            <label>Pais</label>
            <select name="pais.id">
                <option value="">--Selecciona--</option>
                <option th:each="pais : ${paises}" th:value="${pais.id}" th:text="${pais.nomPais}"
                        th:selected="${item.pais != null and item.pais.id == pais.id}"></option>
            </select>
        </div>
        <div class="autor-field">
            <label>Foto</label>
            <select th:field="*{foto}">
                <option value="">--Selecciona una foto--</option>
                <option th:each="foto : ${fotosAutores}" th:value="${foto}" th:text="${foto}"></option>
            </select>
        </div>
        <div class="autor-field">
            <label>Localidad</label>
            <input type="text" th:field="*{localidad}">
        </div>
        <div class="autor-field autor-field-full">
            <label>Biografía</label>
            <textarea th:field="*{biografia}"></textarea>
        </div>
    </div>

    <div class="premios-panel">
        <div class="premios-panel-header">
            <label>Premios del autor</label>
            <button type="button" class="btn-add-premio" id="btn-add-premio">+ Añadir premio</button>
        </div>
        <div id="premios-container">
            <th:block th:if="${premiosActuales != null and !#lists.isEmpty(premiosActuales)}">
                <div class="premio-row" th:each="premioActual : ${premiosActuales}">
                    <div class="premio-field">
                        <label>Premio</label>
                        <select name="premioId">
                            <option value="">--Selecciona premio--</option>
                            <option th:each="premio : ${premiosTipoA}" th:value="${premio.id}" th:text="${premio.nomPremio}"
                                    th:selected="${premioActual.premio != null and premioActual.premio.id == premio.id}"></option>
                        </select>
                    </div>
                    <div class="premio-field premio-field-small">
                        <label>Año</label>
                        <input type="number" name="premioAnio" min="1900" max="2100" th:value="${premioActual.anio}" placeholder="2024">
                    </div>
                    <div class="premio-actions">
                        <button type="button" class="btn-remove-premio">Eliminar</button>
                    </div>
                </div>
            </th:block>
        </div>
    </div>

    <div class="autor-form-actions">
        <button type="submit">Guardar</button>
    </div>
</form>

<template id="premio-row-template">
    <div class="premio-row">
        <div class="premio-field">
            <label>Premio</label>
            <select name="premioId">
                <option value="">--Selecciona premio--</option>
                <option th:each="premio : ${premiosTipoA}" th:value="${premio.id}" th:text="${premio.nomPremio}"></option>
            </select>
        </div>
        <div class="premio-field premio-field-small">
            <label>Año</label>
            <input type="number" name="premioAnio" min="1900" max="2100" placeholder="2024">
        </div>
        <div class="premio-actions">
            <button type="button" class="btn-remove-premio">Eliminar</button>
        </div>
    </div>
</template>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const container = document.getElementById('premios-container');
        const addButton = document.getElementById('btn-add-premio');
        const template = document.getElementById('premio-row-template');

        function addPremioRow() {
            const clone = template.content.cloneNode(true);
            const row = clone.querySelector('.premio-row');
            const removeButton = row.querySelector('.btn-remove-premio');
            removeButton.addEventListener('click', function () {
                row.remove();
            });
            container.appendChild(clone);
        }

        addButton.addEventListener('click', addPremioRow);

        document.querySelectorAll('.btn-remove-premio').forEach(function (button) {
            button.addEventListener('click', function () {
                const row = button.closest('.premio-row');
                if (row) {
                    row.remove();
                }
            });
        });

        if (container.querySelectorAll('.premio-row').length === 0) {
            addPremioRow();
        }
    });
</script>
</body>
</html>
