<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Formulario Libro Premio</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<h2>Formulario Libro Premio</h2>
<a th:href="@{/libro-premios}">Volver</a>
<form th:action="@{/libro-premios/guardar}" th:object="${item}" method="post">
    <input type="hidden" th:field="*{id}">
    <div>
        <label>Libro</label>
        <select name="libro.id" required>
            <option value="">--Selecciona--</option>
            <option th:each="libro : ${libros}" th:value="${libro.id}" th:text="${libro.nomLibro}"
                    th:selected="${item.libro != null and item.libro.id == libro.id}"></option>
        </select>
    </div>
    <div>
        <label>Premio</label>
        <select name="premio.id" required>
            <option value="">--Selecciona--</option>
            <option th:each="premio : ${premios}" th:value="${premio.id}" th:text="${premio.nomPremio}"
                    th:selected="${item.premio != null and item.premio.id == premio.id}"></option>
        </select>
    </div>
    <button type="submit">Guardar</button>
</form>
</body>
</html>
